services:
  mysql:
    image: mysql:8.0
    container_name: jiahua_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jiahua_db
      MYSQL_USER: jiahua_user
      MYSQL_PASSWORD: jiahua_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: